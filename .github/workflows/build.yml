name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        working-directory: neoforge
        run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Build Fabric
        working-directory: fabric
        run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: texturebrush
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar

      - name: Attach jar to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" neoforge/build/libs/*.jar fabric/build/libs/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
