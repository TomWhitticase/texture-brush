plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'texturebrush-fabric'
}

repositories {
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

fabricApi {
    // In-game test that builds with the brush and screenshots the editor: ./gradlew runClientGameTest
    configureTests {
        createSourceSet = true
        modId = 'texturebrush-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Pattern logic shared with the NeoForge build.
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.test.java.srcDir('../common/src/test/java')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

jar {
    from('../LICENSE')
}
